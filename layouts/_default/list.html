{{ define "main" }}
<article class="page">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
  </header>
  {{ if .Content }}
  <div class="page-content">{{ .Content }}</div>
  {{ end }}
  {{ if .Pages }}
  <ul class="post-list">
    {{ range .Pages.ByDate.Reverse }}
    <li>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </li>
    {{ end }}
  </ul>
  {{ end }}
</article>
{{ end }}
